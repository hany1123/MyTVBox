name: MyTVBox
options:
  bundleIdPrefix: com.mytvbox
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.8.5"
    CURRENT_PROJECT_VERSION: "20261112.32"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
targets:
  MyTVBox:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MyTVBox
        excludes:
          - "Info.plist"
          - "MyTVBox-Bridging-Header.h"
          # 排除掉，下面用 folder reference 单独加，避免资源被收录两次
          - "Resources/NodeProject"
      # 端上 Node 项目：整目录作为 folder reference（蓝色文件夹）拷进 Bundle。
      # 注意：type: folder 必须放在 sources 里并显式指定 buildPhase，写进
      # resources 字段是不生效的（1.7.0 第一次构建就因为这点导致资源没进包）。
      - path: MyTVBox/Resources/NodeProject
        type: folder
        buildPhase: resources
    resources:
      - MyTVBox/Assets.xcassets
    dependencies:
      # 1.7.0 端上 Node 运行时（nodejs-mobile v18.20.4，动态库，54.9 MB）
      # CI 在 xcodegen 之前下载解压到仓库根目录。
      - framework: NodeMobile.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        INFOPLIST_FILE: MyTVBox/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.newbox.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
        SWIFT_OBJC_BRIDGING_HEADER: "MyTVBox/MyTVBox-Bridging-Header.h"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lc++"
    info:
      path: MyTVBox/Info.plist
      properties:
        CFBundleDisplayName: NewBox
        CFBundleIdentifier: com.newbox.ios
        CFBundleShortVersionString: "1.8.5"
        CFBundleVersion: "20261112.32"
        MinimumOSVersion: "16.0"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
